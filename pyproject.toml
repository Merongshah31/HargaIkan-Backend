[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hargaikan"
version = "2.0.0"
description = "HargaIkan v2: historical fish price reference for Kuala Lumpur"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"
markers = [
    "integration: live Supabase/Pinecone tests; skipped when credentials are missing",
]
