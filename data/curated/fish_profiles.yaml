# Curated fish profiles (DRAFT). Loaded by hargaikan.pipeline.curated.load_profiles.
#
# Review: these entries are first drafts written for the 10 demo species and have NOT been
# checked by a human reviewer. Before relying on them, a reviewer should confirm each field
# (texture, taste, bone level, cooking methods, allergen groups) against a trusted source and
# fix anything wrong. Profiles feed the "profile differences" text shown next to a suggestion;
# they never create a suggestion by themselves (only verified similarity edges do).
#
# Schema (one entry per species code; codes must exist in the species catalog):
#   species_code: IKAN_...          texture: text      taste: text      bone_level: text
#   cooking_methods: [text, ...]    allergen_groups: [text, ...]        notes: text or null
# Vocabulary used here: texture lembut | pejal; bone_level sedikit | sederhana | banyak.
# Keep text ASCII Bahasa Melayu so dump_profiles round-trips it unchanged.

